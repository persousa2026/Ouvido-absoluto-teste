name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Executar testes unitarios
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Gerar APK debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OuvidoAbsolutoAI-0.5-debug.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OuvidoAbsolutoAI-debug
          path: OuvidoAbsolutoAI-0.5-debug.apk
          if-no-files-found: error
          retention-days: 30
